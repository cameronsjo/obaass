# Keeps the commit-SHA pins in .github/workflows current. Dependabot updates
# both the SHA and the trailing `# vX.Y.Z` comment on each `uses:` line.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
