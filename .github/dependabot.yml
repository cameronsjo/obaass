# Keeps the commit-SHA pins in .github/workflows current. Dependabot updates
# both the SHA and the trailing `# vX.Y.Z` comment on each `uses:` line.
# Minor and patch updates are grouped; a major update opens its own PR so a
# new major of the signing and attesting actions gets individual review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
